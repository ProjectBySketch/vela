name: studio

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: studio build (linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build the studio
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: vela-studio
          path: studio/dist
          if-no-files-found: error
      - name: Type check the toolchain
        run: npm run lint
